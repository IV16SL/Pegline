name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Pegline.exe
        shell: pwsh
        run: ./build.ps1

      - name: Run tests
        shell: pwsh
        run: ./test.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pegline
          path: build/Pegline.exe
